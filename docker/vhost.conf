<VirtualHost *:80>
    ServerAdmin theteam@nospariodigital.co.uk

    # Document root = /public (the only web-accessible directory).
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defense in depth: src/ and handlers/ already live outside DocumentRoot,
    # so they are not reachable over HTTP.

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
